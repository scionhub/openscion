name = "openscion-filecoin-poc"
main = "src/index.ts"
compatibility_date = "2024-10-21"

[[containers]]
class_name = "EngineContainer"
image = "../../containers/openscion-server/Dockerfile"
max_instances = 4

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "EngineContainer"

[[durable_objects.bindings]]
name = "D1GW"
class_name = "D1Gateway"
[[d1_databases]]
binding = "DB_SCIONHUB_TOP"
database_name = "scionhub-top"
database_id = "052406e2-b552-4792-baca-52ca7e6cd6bf"
migrations_dir = "migrations/top"

[vars]
# Optional: set in env or with `wrangler secret put`
# ADMIN_TOKEN = ""
# PDP_BASE_URL = "https://pdp.example.com"
# SYNAPSE_API_KEY = ""
# DEFAULT_PROVIDER_ID = "provider-default"

[exports.EngineContainer]
type = "durable-object"
storage = "sqlite"

[exports.D1Gateway]
type = "durable-object"
storage = "sqlite"
