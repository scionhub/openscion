[package]
name = "openscion-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The OpenScion server: the authoritative tier that serves the OpenScion API over HTTP."
documentation = "https://docs.rs/openscion-server"
readme = "README.md"
keywords = ["vcs", "source-control", "monorepo", "server"]
categories = ["development-tools"]
publish = false

[[bin]]
name = "openscion-server"
path = "src/main.rs"

[dependencies]
# The engine and, through its re-export, the protocol payloads this server
# answers with.
openscion-core = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true }
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls"] }
ethers-core = { version = "2" }
ethers-signers = { version = "2" }
cid = "0.11"
hex = "0.4"
base64 = "0.22"
argon2 = "0.5"
sha2 = "0.10"
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
# The integration tests call a running server over real HTTP.
ureq = { workspace = true }
# The API tests send typed payloads as JSON bodies.
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
